[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-retention"
version = "2.0.0"
description = "Reproducible profit-aware telecom retention capstone"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<1.8", "scipy>=1.15,<1.18", "xgboost>=3,<4", "shap>=0.48,<0.50", "streamlit>=1.65,<2", "plotly>=6,<7", "matplotlib>=3.10,<4", "pyyaml>=6,<7", "requests>=2.32,<3", "tabulate>=0.9", "joblib>=1.4", "pytest>=8,<10", "nbformat>=5", "nbconvert>=7", "ipykernel>=6", "jinja2>=3.1,<4", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
pdf = ["docx2pdf>=0.1.8; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telco_retention = ["templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*missing ScriptRunContext.*"]
